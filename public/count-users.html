<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Count Users</title>

    <script src="shared/theme.js"></script>

    <link
        rel="stylesheet"
        href="shared/theme.css"
    >

    <link
        rel="stylesheet"
        href="count-users.css"
    >

</head>


<body>

    <main class="page-container">

        <header class="page-header">

            <h1>Count Users</h1>

            <p>
                Count uses who has received meals and who hasn't.
            </p>

        </header>


        <!-- Tabs -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                data-tab="remaining"
            >
                Remaining

                <span
                    id="remainingCount"
                    class="tab-count"
                >
                    0
                </span>

            </button>


            <button
                type="button"
                class="tab"
                data-tab="completed"
            >
                Completed

                <span
                    id="completedCount"
                    class="tab-count"
                >
                    0
                </span>

            </button>

        </div>


        <!-- Remaining -->

        <section
            class="tab-content active"
            data-tab-content="remaining"
        >

            <div
                id="remainingUsers"
                class="users-container"
            >
            </div>

        </section>


        <!-- Completed -->

        <section
            class="tab-content"
            data-tab-content="completed"
        >

            <div
                id="completedUsers"
                class="users-container"
            >
            </div>

        </section>

    </main>


    <script src="count-users.js"></script>

</body>

</html>
