<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile</title>

    <script src="shared/theme.js"></script>

    <link
        rel="stylesheet"
        href="shared/theme.css"
    >

    <link
        rel="stylesheet"
        href="edit-profile.css"
    >
</head>

<body>

    <main class="page-container">

        <section class="profile-container">

            <div class="page-header">
                <h1>Edit Profile</h1>

                <p>
                    Update your profile information
                </p>
            </div>


            <!-- Profile Picture -->

            <div class="profile-picture-section">

                <div class="profile-picture-wrapper">

                    <img
                        id="profileImage"
                        class="profile-image"
                        src=""
                        alt="Profile picture"
                    >

                </div>


                <label
                    for="profilePicture"
                    class="change-picture-btn"
                >
                    Change Profile Picture
                </label>

                <input
                    type="file"
                    id="profilePicture"
                    accept="image/png,image/jpeg,image/heif,.heic"
                    hidden
                >

                <p
                    id="pictureMessage"
                    class="field-message"
                ></p>

            </div>


            <!-- Profile Form -->

            <form
                id="editProfileForm"
                class="profile-form"
            >

                <!-- Name -->

                <div class="form-group">

                    <label for="profileName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="profileName"
                        name="name"
                        placeholder="Enter your full name"
                        pattern="[A-Za-z .]{3,}"
                        title="Minimum 3 characters. Only letters, spaces, and dots are allowed"
                        required
                    >

                </div>


                <!-- Username -->

                <div class="form-group">

                    <label for="profileUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="profileUsername"
                        name="username"
                        disabled
                    >

                    <small class="field-hint">
                        Username cannot be changed.
                    </small>

                </div>


                <!-- Batch -->

                <div class="form-group">

                    <label for="profileUsername">
                        Batch
                    </label>

                    <input
                        type="text"
                        id="profileBatch"
                        name="batch"
                        disabled
                    >

                    <small class="field-hint">
                        Username cannot be changed.
                    </small>

                </div>


                <!-- Department -->

                <div class="form-group">

                    <label for="profileDepartment">
                        Department
                    </label>

                    <select
                        id="profileDepartment"
                        name="department"
                        required
                    >

                        <option
                            value=""
                            disabled
                        >
                            Select your department
                        </option>

                        <option value="YE">
                            Yarn Engineering
                        </option>

                        <option value="FE">
                            Fabric Engineering
                        </option>

                        <option value="AE">
                            Apparel Engineering
                        </option>

                        <option value="WPE">
                            Wet Process Engineering
                        </option>

                    </select>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="profileEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="profileEmail"
                        name="email"
                        disabled
                    >

                    <small class="field-hint">
                        Email cannot be changed.
                    </small>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="profilePhone">
                        Phone
                    </label>

                    <div class="phone-input">

                        <span class="country-code">
                            +88
                        </span>

                        <input
                            type="tel"
                            id="profilePhone"
                            name="phone"
                            placeholder="01XXXXXXXXX"
                            maxlength="11"
                            pattern="01[0-9]{9}"
                            inputmode="numeric"
                            required
                        >

                    </div>

                </div>


                <p
                    id="formMessage"
                    class="form-message hidden"
                ></p>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Save Changes
                </button>

            </form>


            <!-- Change Password -->

            <div class="change-password-section">

                <a
                    href="/change-password.html"
                    class="change-password-link"
                >
                    Change Password
                </a>

            </div>

        </section>

    </main>


    <script src="edit-profile.js"></script>

</body>

</html>
