<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Banned Profile - Meal Mate</title>

    <script src="shared/theme.js"></script>
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="banned.css">

</head>


<body>

    <main class="page-container">

        <div class="banned-card">

            <!-- ==========================
                 Banned Message
            =========================== -->

            <div class="banned-message">

                <h1>Profile Banned</h1>

                <p>
                    This profile has been banned and can no longer
                    be used to access Meal Mate.
                </p>

            </div>


            <!-- ==========================
                 Profile Information
            =========================== -->

            <div
                id="profileInformation"
                class="profile-card hidden"
            >

                <h2>Your Profile</h2>


                <img
                    id="profileImage"
                    class="profile-image"
                    src=""
                    alt="Profile picture"
                >


                <div class="profile-info">

                    <div class="profile-field">
                        <span>Name</span>
                        <strong id="profileName"></strong>
                    </div>

                    <div class="profile-field">
                        <span>Username</span>
                        <strong id="profileUsername"></strong>
                    </div>

                    <div class="profile-field">
                        <span>Department</span>
                        <strong id="profileDepartment"></strong>
                    </div>

                    <div class="profile-field">
                        <span>Batch</span>
                        <strong id="profileBatch"></strong>
                    </div>

                    <div class="profile-field">
                        <span>Phone</span>
                        <strong id="profilePhone"></strong>
                    </div>

                </div>

            </div>


            <!-- ==========================
                 Delete Profile
            =========================== -->

            <div
                id="deleteSection"
                class="delete-section hidden"
            >

                <p>
                    If you no longer want to use this account,
                    you can permanently delete your profile.
                </p>


                <button
                    id="deleteProfileBtn"
                    type="button"
                    class="delete-button"
                >
                    Delete Profile
                </button>


                <p
                    id="errorMessage"
                    class="error-message"
                ></p>

            </div>

        </div>

    </main>


    <script src="banned.js"></script>

</body>

</html>
